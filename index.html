<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Nine stars hidden in a night sky, one for every day left. Week four of a countdown."
    />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nine Lights" />
    <meta property="og:description" content="Nine days. Nine stars. One sky, and it is yours." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Nine Lights</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration shell: one point of light in an empty sky. -->
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-shell__seed"></div>
      </div>
    </div>
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #05060f;
          color: #fffdfa;
          font-family: Georgia, serif;
          text-align: center;
          padding: 2rem;
          line-height: 1.9;
        "
      >
        <p>
          There is a sky here, with nine stars in it that belong to one person.<br />
          Please enable JavaScript to look up.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
